<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-T12BGYGXSG');</script>
<script>document.documentElement.dataset.theme='dark';try{if(localStorage.getItem('theme')==='light')delete document.documentElement.dataset.theme}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
<style>
html[data-theme=dark] body{background:#131311;color:#e7e5de}
html[data-theme=dark] .markdown-body a{color:#8fc9a0}
html[data-theme=dark] .markdown-body h1,html[data-theme=dark] .markdown-body h2,html[data-theme=dark] .markdown-body hr{border-color:#2e2d29}
html[data-theme=dark] .markdown-body hr{background:#2e2d29}
html[data-theme=dark] .markdown-body blockquote{color:#98938a;border-color:#2e2d29}
html[data-theme=dark] .markdown-body table tr{background:#131311;border-color:#2e2d29}
html[data-theme=dark] .markdown-body table tr:nth-child(2n){background:#1a1a17}
html[data-theme=dark] .markdown-body table th,html[data-theme=dark] .markdown-body table td{border-color:#2e2d29}
html[data-theme=dark] .markdown-body code,html[data-theme=dark] .markdown-body pre{background:#1a1a17;color:#e7e5de}
#theme{position:fixed;top:12px;right:12px;z-index:5;background:transparent;border:1px solid #e2e0d8;padding:7px 11px;font-family:'IBM Plex Mono',ui-monospace,monospace;font-size:12px;color:#6f6b62;cursor:pointer;white-space:nowrap;outline:none}
#theme:hover{color:#1b1a17;border-color:#6f6b62}
html[data-theme=dark] #theme{border-color:#2e2d29;color:#98938a}
html[data-theme=dark] #theme:hover{color:#e7e5de;border-color:#98938a}
</style>
<script>
document.addEventListener('DOMContentLoaded',()=>{
  const html=document.documentElement,btn=document.createElement('button');
  btn.id='theme';btn.type='button';
  const setLabel=()=>btn.textContent=html.dataset.theme==='dark'?'라이트':'다크';
  setLabel();
  btn.addEventListener('click',()=>{
    const dark=html.dataset.theme==='dark';
    if(dark)delete html.dataset.theme;else html.dataset.theme='dark';
    try{localStorage.setItem('theme',dark?'light':'dark')}catch(e){}
    setLabel();
  });
  document.body.appendChild(btn);
});
</script>
